name: Release

on:
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'truestealth/node-consul'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm

    permissions:
      contents: read
      id-token: write

    env:
      CI: true
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate package and release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';

          const metadata = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(metadata.name, '@truestealth/consul', 'Unexpected npm package name');
          assert.equal(process.env.RELEASE_TAG, `v${metadata.version}`, 'Release tag must match package.json version');

          const distTag = metadata.version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${distTag}\n`);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm types

      - name: Test
        run: pnpm test

      - name: Check package contents
        run: npm pack --dry-run

      - name: Update npm CLI
        run: npm install --global npm@11

      - name: Publish with npm Trusted Publishing
        run: npm publish --access public --tag "$NPM_DIST_TAG" --registry https://registry.npmjs.org
