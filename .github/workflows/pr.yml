name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm types

      - name: Test
        run: pnpm test

      - name: Check package
        run: npm run package:check

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONSUL_VERSION: 2.0.4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Consul
        run: |
          mkdir -p "$RUNNER_TEMP/consul"
          cd "$RUNNER_TEMP/consul"
          curl --fail --silent --show-error --location --remote-name "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_amd64.zip"
          curl --fail --silent --show-error --location --remote-name "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_SHA256SUMS"
          sha256sum --check --ignore-missing "consul_${CONSUL_VERSION}_SHA256SUMS"
          unzip "consul_${CONSUL_VERSION}_linux_amd64.zip"
          echo "CONSUL_BIN=$RUNNER_TEMP/consul/consul" >> "$GITHUB_ENV"

      - name: Acceptance
        run: npm run acceptance
